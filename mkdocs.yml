site_name: ChangBin Yoon | Portfolio
site_description: 윤창빈(ChangBin Yoon) 포트폴리오 - 데이터 플랫폼 인프라 엔지니어. Kubernetes 기반 Lakehouse/DataOps 전환, Trino/Spark/Iceberg, 스토리지 검증 경험.
site_author: ChangBin Yoon
site_url: https://changbin-yoon.github.io/portfolio/

copyright: Copyright &copy; 2026 ChangBin Yoon

theme:
  name: material
  language: ko
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환

nav:
  - 홈: index.md
  - 소개: about/index.md
  - 경력:
      - 개요: experience/index.md
      - 미리비트: experience/miribit.md
      - 커미조아: experience/commizoa.md
  - 프로젝트:
      - 개요: projects/index.md
      - Kubernetes 데이터플랫폼: projects/kubernetes-platform.md
      - Query Engine: projects/query-engine.md
      - 스토리지: projects/storage.md
      - 메타데이터(HMS): projects/metastore.md
      - 배포 자동화: projects/automation.md
      - T-Hadoop 레거시: projects/hadoop-legacy.md
      - 신기술 PoC·문서화: projects/poc-and-docs.md
  - 업무내역:
      - 요약: work/index.md
      - 트러블슈팅:
          - 01. YuniKorn Gang Scheduling과 conntrack 부하: work/troubleshooting/01-yunikorn-conntrack.md
          - 02. API 서버 부하 & Watch 레이스: work/troubleshooting/02-apiserver-watch-race.md
          - 03. ClusterMesh 신규 PodCIDR 라우팅 누락: work/troubleshooting/03-clustermesh-podcidr.md
          - 04. 190노드 중 3노드 PodCIDR 경로 누락: work/troubleshooting/04-podcidr-missing-routes.md
          - 05. Spark × YuniKorn 작업 지연: work/troubleshooting/05-spark-yunikorn-delay.md
          - 06. Airflow 3.x 운영: work/troubleshooting/06-airflow-3x.md
          - 07. CNPG & Cilium 업그레이드 영향: work/troubleshooting/07-cnpg-cilium.md
          - 08. OpenSearch 스냅샷 리포지토리: work/troubleshooting/08-opensearch-snapshot.md
          - 09. DirectPV Erasure Set 쓰기 차단: work/troubleshooting/09-directpv-erasure-set.md
      - PoC:
          - 01. 클러스터 구축·운영 도구: work/poc/01-cluster-tooling.md
          - 02. n8n 기반 모니터링 자동화: work/poc/02-n8n-monitoring.md
          - 03. Kafka 이벤트 파이프라인: work/poc/03-kafka-events.md
          - 04. DirectPV · Sidekick 배치 방식: work/poc/04-directpv-sidekick.md
          - 05. StarRocks / Spark · Iceberg · HMS 연동: work/poc/05-query-engine.md
      - 검증:
          - 01. Cilium BGP Control Plane & ClusterMesh: work/verification/01-cilium-bgp-clustermesh.md
          - 02. Cilium 1.18 → 1.19 무중단 업그레이드: work/verification/02-cilium-upgrade.md
          - 03. Prometheus Agent 모드: work/verification/03-prometheus.md
          - 04. Spark Operator HA & 리더 일렉션: work/verification/04-spark-operator-ha.md
          - 05. LDAP 연동 Access Key 권한 전파: work/verification/05-ldap-iam.md
          - 06. 고사용률 구간 동작: work/verification/06-capacity.md
          - 07. 트래픽 분산 경로 (L4 vs L7): work/verification/07-network-l4-l7.md
          - 08. Kubeflow Spark Operator 운영 분석 보고서: work/verification/08-kubeflow-spark-operator-report.md
          - 09. Oracle 21c/26ai HMS 스키마 검증: work/verification/09-oracle-hms-schema.md
          - 10. HMS vs Polaris 카탈로그 비교: work/verification/10-hms-vs-polaris.md
  - 연락처: contact/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  # lunr는 한국어 형태소 분석을 지원하지 않는다.
  # 검색 언어는 en으로 두고, 한글 토큰이 끊기지 않도록 구분자만 조정한다.
  - search:
      lang:
        - en
      separator: '[\s\-,:!=\[\]()"/]+'

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/changbin-yoon
      name: GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:hsycb3650@gmail.com
      name: Email
    - icon: fontawesome/solid/blog
      link: https://changby-cns.tistory.com/
      name: Blog
